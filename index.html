<title>創作ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#F1F2F7;
    --surface:#F1F2F7;
    --surface-2:#E7E9F1;
    --ink:#211B3D;
    --ink-soft:#726D93;
    --ink-faint:#A6A1C4;
    --line:#E9E7F4;
    --line-strong:#D3CFEA;
    --accent:#3E586F;
    --accent-deep:#3E586F;
    --accent-ink:#FFFFFF;
    --teal:#0FA394;
    --yellow:#E0A63C;
    --purple:#7C5CFC;
    --red:#E24E6B;
    --green:#1FA070;
    --gray:#9C97AE;
    --neu-light: rgba(255,255,255,.9);
    --neu-dark: rgba(163,173,199,.55);
    --shadow: 7px 7px 14px var(--neu-dark), -7px -7px 14px var(--neu-light);
    --shadow-sm: 4px 4px 9px var(--neu-dark), -4px -4px 9px var(--neu-light);
    --shadow-inset: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
    --shadow-inset-sm: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
    --ring: 0 0 0 1.5px rgba(62,88,111,.28);
    --ring-hover: 0 0 0 1.5px rgba(62,88,111,.46);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --font-display:'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    --font-body:'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.7;
  }
  h1,h2,h3,h4,button,input,select,textarea{ font-family:var(--font-display); }
  h1,h2,h3,h4{ margin:0; text-wrap:balance; color:var(--ink); }
  p{ margin:0; }
  a{ color:var(--accent-deep); }
  ::selection{ background:var(--yellow); color:var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  .fade-in{ animation:fadeInUp .5s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(10px) scale(.99);} to{ opacity:1; transform:translateY(0) scale(1);} }
  @keyframes popIn{ from{ opacity:0; transform:scale(.9);} to{ opacity:1; transform:scale(1);} }
  @keyframes tabSlideIn{ from{ opacity:0; transform:translateX(18px);} to{ opacity:1; transform:translateX(0);} }
  .tab-anim{ animation:tabSlideIn .3s cubic-bezier(.2,.8,.25,1) both; }

  button{ cursor:pointer; border:none; font-weight:700; }
  .btn{
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
    background:var(--bg); color:var(--ink); border:none;
    padding:9px 18px; border-radius:999px; font-size:14px; box-shadow:var(--shadow-sm), var(--ring);
    transition:box-shadow .15s ease;
  }
  .btn:hover{ box-shadow:var(--shadow), var(--ring-hover); }
  .btn:active{ box-shadow:var(--shadow-inset-sm), var(--ring-hover); }
  .btn:focus-visible{ outline:3px solid var(--purple); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light); }
  .btn-primary:hover{ box-shadow:7px 7px 14px var(--neu-dark), -7px -7px 14px var(--neu-light); }
  .btn-primary:active{ box-shadow:inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); }
  .btn-ghost{ background:transparent; box-shadow:var(--ring); color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--ink); background:var(--surface-2); box-shadow:var(--shadow-inset-sm), var(--ring-hover); }
  .btn-danger{ background:#FFF0EE; color:var(--red); box-shadow:2px 2px 5px var(--neu-dark), -2px -2px 5px var(--neu-light), 0 0 0 1.5px rgba(226,78,106,.25); }
  .btn-danger:hover{ box-shadow:3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light), 0 0 0 1.5px rgba(226,78,106,.4); }
  .btn-danger:active{ box-shadow:inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light), 0 0 0 1.5px rgba(226,78,106,.4); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; box-shadow:2.5px 2.5px 6px var(--neu-dark), -2.5px -2.5px 6px var(--neu-light), var(--ring); }
  .btn-sm:hover{ box-shadow:3.5px 3.5px 8px var(--neu-dark), -3.5px -3.5px 8px var(--neu-light), var(--ring-hover); }
  .btn-sm:active{ box-shadow:inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light), var(--ring-hover); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }

  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%; border:none; border-radius:var(--radius-sm);
    padding:10px 12px; font-size:14px; font-family:var(--font-body); background:var(--bg); color:var(--ink);
    box-shadow:var(--shadow-inset-sm), var(--ring);
  }
  input:focus,textarea:focus,select:focus{ outline:none; box-shadow:var(--shadow-inset-sm), 0 0 0 3px rgba(62,88,111,.36); }
  textarea{ resize:vertical; min-height:70px; }
  label.field{ display:block; margin-bottom:12px; }
  label.field > span{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.02em; }
  .hint{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .hint-warn{ color:#B8790C; font-weight:700; }

  input[type=color]{ -webkit-appearance:none; width:38px; height:38px; border:none; border-radius:10px; padding:2px; background:var(--bg); box-shadow:var(--shadow-inset-sm), 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); flex:none; }
  input[type=color]::-webkit-color-swatch{ border-radius:6px; border:none; }
  .color-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatch{ width:24px; height:24px; border-radius:50%; border:2px solid rgba(0,0,0,.08); cursor:pointer; transition:transform .1s; }
  .swatch:hover{ transform:scale(1.15); }
  .swatch.active{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  input.hexcode-input{ width:84px; font-family:monospace; font-size:12px; color:var(--ink-soft); background:var(--surface-2); padding:6px 8px; border-radius:8px; box-shadow:var(--shadow-inset-sm); text-transform:uppercase; }
  input.hexcode-input:focus{ color:var(--ink); box-shadow:var(--shadow-inset-sm), 0 0 0 3px rgba(62,88,111,.36); }
  .image-field-row{ display:flex; align-items:center; gap:12px; }
  .image-preview{ width:72px; height:72px; border-radius:16px; overflow:hidden; background:var(--surface-2); box-shadow:var(--shadow-inset-sm); flex:none; display:flex; align-items:center; justify-content:center; }
  .image-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .image-preview-empty{ font-size:10.5px; color:var(--ink-faint); text-align:center; padding:0 6px; }
  .image-field-controls{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .image-field-controls input[type=file]{ font-size:12px; padding:0; border:none; }
  .image-field-controls .btn{ padding:4px 10px; font-size:11px; }

  /* App shell */
  #app{ min-height:100vh; display:flex; }
  .hidden{ display:none !important; }

  /* Gate: project picker */
  #gate{ width:100%; max-width:900px; margin:0 auto; padding:48px 20px 60px; }
  .usage-box{ display:flex; align-items:center; gap:10px; margin-top:28px; flex-wrap:wrap; }
  .usage-result{ font-size:12.5px; color:var(--ink-soft); }
  #authGate{ width:100%; max-width:460px; margin:0 auto; padding:90px 20px 40px; text-align:center; }
  .auth-box{ margin-top:28px; background:var(--bg); border-radius:var(--radius-lg); padding:28px; box-shadow:var(--shadow); }
  .auth-status{ color:var(--ink-soft); font-size:14px; margin-bottom:16px; }
  .auth-denied p{ color:var(--ink-soft); font-size:13.5px; line-height:1.7; margin-bottom:16px; }
  .auth-denied b{ color:var(--ink); }
  .gate-hero{ text-align:center; margin-bottom:36px; }
  .gate-hero h1{ font-size:clamp(26px,5vw,34px); font-weight:800; margin-top:8px; }
  .gate-hero p{ color:var(--ink-soft); margin-top:8px; font-size:14.5px; }
  .project-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-top:24px; }
  .project-card{
    background:var(--bg); border:none; border-radius:var(--radius-lg);
    padding:20px; box-shadow:var(--shadow), var(--ring); cursor:pointer; text-align:left; position:relative; overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .project-card:hover{ transform:translateY(-3px); box-shadow:9px 9px 18px var(--neu-dark), -9px -9px 18px var(--neu-light), var(--ring-hover); }
  .project-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:8px; background:var(--pc,var(--accent)); }
  .project-card .pname{ font-weight:800; font-size:17px; margin-top:6px; }
  .project-card .pdesc{ color:var(--ink-soft); font-size:12.5px; margin-top:6px; min-height:34px; }
  .project-card .pmeta{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .pmeta-btn{ font-family:var(--font-body); font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--bg); border:none; border-radius:999px; padding:4px 12px; box-shadow:2.5px 2.5px 6px var(--neu-dark), -2.5px -2.5px 6px var(--neu-light), var(--ring); }
  .pmeta-btn:hover{ color:var(--ink); box-shadow:3.5px 3.5px 8px var(--neu-dark), -3.5px -3.5px 8px var(--neu-light), var(--ring-hover); }
  .pmeta-btn:active{ box-shadow:inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light), var(--ring-hover); }
  .project-new{
    border:none; border-radius:var(--radius-lg); background:var(--bg); box-shadow:var(--shadow), var(--ring);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:130px;
    color:var(--ink-soft); font-size:14px; font-weight:700; cursor:pointer; transition:box-shadow .15s ease;
  }
  .project-new:hover{ color:var(--accent-deep); box-shadow:9px 9px 18px var(--neu-dark), -9px -9px 18px var(--neu-light), var(--ring-hover); }
  .project-new:active{ box-shadow:var(--shadow-inset), var(--ring-hover); }
  .project-new .plus{ font-size:26px; }

  /* Sidebar */
  .sidebar{
    width:230px; flex:none; background:var(--bg); border-right:none;
    display:flex; flex-direction:column; padding:18px 14px; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto;
    box-shadow:6px 0 16px var(--neu-dark);
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; padding:0 4px; }
  .current-project{
    background:var(--bg); border-radius:var(--radius-md); padding:12px; box-shadow:var(--shadow-inset-sm);
  }
  .current-project .cp-top{ display:flex; align-items:center; gap:8px; }
  .cp-dot{ width:14px; height:14px; border-radius:50%; flex:none; background:var(--pc,var(--accent)); box-shadow:0 0 0 3px rgba(0,0,0,.05); }
  .current-project .cp-name{ font-weight:800; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cp-switch{ margin-top:8px; width:100%; }

  nav.tabs{ display:flex; flex-direction:column; gap:4px; }
  .tab-btn{
    display:flex; align-items:center; gap:10px; text-align:left; background:transparent; border:none;
    padding:10px 12px; border-radius:var(--radius-sm); color:var(--ink-soft); font-weight:700; font-size:14px;
    position:relative; transition:box-shadow .15s ease, color .15s ease;
  }
  .tab-btn:hover{ color:var(--ink); box-shadow:var(--shadow-sm); }
  .tab-btn.active{ background:var(--bg); color:var(--accent-deep); box-shadow:var(--shadow); font-weight:800; }
  .tab-badge{ margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:800; border-radius:999px; padding:1px 7px; }

  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  .nickname-box label.field{ margin-bottom:0; }
  .sync-pill{ font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; padding:2px 4px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); }
  .sync-dot.local{ background:var(--yellow); }

  /* Mobile nav */
  .mobile-topbar{ display:none; }
  nav.tabs.mobile-tabs{ display:none; }

  /* Main */
  main{ flex:1; min-width:0; padding:28px 34px 80px; }
  .content-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .content-head h2{ font-size:22px; font-weight:800; }
  .content-head .sub{ color:var(--ink-soft); font-size:13px; margin-top:4px; }

  .empty-state{
    border:none; border-radius:var(--radius-lg); padding:40px 20px; text-align:center; color:var(--ink-soft);
    background:var(--bg); box-shadow:var(--shadow-inset);
  }

  /* Character cards */
  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .char-card{
    background:var(--bg); border:none; border-radius:var(--radius-md); padding:16px 16px 16px 20px;
    box-shadow:var(--shadow-sm), inset 6px 0 0 var(--cc,var(--accent)), var(--ring); display:flex; flex-direction:column; gap:8px;
    cursor:pointer; transition:box-shadow .15s ease, transform .12s ease;
  }
  .char-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow), inset 6px 0 0 var(--cc,var(--accent)), var(--ring-hover); }
  .char-card .ch-top{ display:flex; align-items:center; gap:10px; }
  .ch-avatar{ width:38px; height:38px; border-radius:50%; background:var(--cc,var(--accent)); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; }
  .ch-avatar-img{ width:38px; height:38px; border-radius:50%; object-fit:cover; flex:none; box-shadow:0 0 0 2px var(--cc,var(--accent)); }
  .rel-avatar{ width:22px; height:22px; border-radius:50%; object-fit:cover; flex:none; vertical-align:middle; box-shadow:0 0 0 2px var(--cc, rgba(0,0,0,.08)); }
  .rel-avatar-fallback{ width:22px; height:22px; border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:10.5px; vertical-align:middle; box-shadow:0 0 0 2px var(--cc, rgba(0,0,0,.12)); }
  .rel-pair{ display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:14.5px; color:var(--ink); }
  .ch-name{ font-weight:800; font-size:15.5px; }
  .ch-reading{ font-size:11px; color:var(--ink-faint); }
  .ch-role{ font-size:11.5px; color:var(--ink-soft); background:var(--surface-2); display:inline-block; padding:2px 9px; border-radius:999px; margin-top:2px; }
  .ch-line{ font-size:12.5px; color:var(--ink-soft); }
  .ch-line b{ color:var(--ink); font-weight:700; }
  .ch-desc{ font-size:12.5px; color:var(--ink-soft); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card-actions{ display:flex; justify-content:flex-end; gap:6px; margin-top:auto; padding-top:6px; }
  .updated-by{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; }

  .char-view-toggle{ display:flex; gap:2px; background:var(--bg); border-radius:999px; padding:4px; flex:none; box-shadow:var(--shadow-inset-sm); }
  .char-view-toggle button{ font-family:var(--font-body); font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:999px; background:transparent; color:var(--ink-soft); }
  .char-view-toggle button.active{ background:var(--bg); color:var(--accent-deep); box-shadow:var(--shadow-sm); }

  .nickname-table-wrap{ overflow-x:auto; border:1px solid var(--line-strong); border-radius:var(--radius-sm); }
  .nickname-table{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  .nickname-table th, .nickname-table td{ border:1px solid var(--line-strong); padding:7px 10px; white-space:nowrap; }
  .nickname-table th{ font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--surface-2); text-align:center; }
  .callname-corner{ background:var(--surface-2); position:sticky; left:0; z-index:2; }
  .callname-rowhead{ text-align:left !important; position:sticky; left:0; background:var(--surface-2); z-index:1; }
  .callname-colhead{ min-width:96px; }
  .callname-self{ background:linear-gradient(to top right, transparent calc(50% - 1px), var(--line-strong) calc(50% - 1px), var(--line-strong) calc(50% + 1px), transparent calc(50% + 1px)); }
  input.callname-input{ width:100%; padding:4px 2px; font-size:12.5px; text-align:center; background:transparent; box-shadow:none; }
  input.callname-input:focus{ box-shadow:0 0 0 2px rgba(91,82,214,.3); border-radius:4px; }

  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0 24px; }
  .toolbar .search-input{ flex:1; min-width:160px; max-width:280px; width:auto; }
  .toolbar select{ width:auto; }

  [draggable=true]{ cursor:grab; }
  .dragging{ opacity:.4; }
  .drag-over{ outline:2px dashed var(--accent); outline-offset:2px; }

  .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
  .gallery-tile{ position:relative; border-radius:var(--radius-md); overflow:hidden; aspect-ratio:3/4; cursor:pointer; background:var(--surface-2); box-shadow:var(--shadow-sm), 0 0 0 3px var(--gc,var(--line-strong)), var(--ring); transition:transform .12s ease, box-shadow .12s ease; }
  .gallery-tile:hover{ transform:translateY(-3px); box-shadow:var(--shadow), 0 0 0 3px var(--gc,var(--line-strong)), var(--ring-hover); }
  .gallery-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-tile .gt-noimg{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; }
  .gallery-tile .gt-label{ position:absolute; left:0; right:0; bottom:0; padding:9px 10px 8px; background:linear-gradient(transparent, rgba(15,10,35,.72)); color:#fff; }
  .gallery-tile .gt-label .gt-name{ font-size:12.5px; font-weight:800; }
  .gallery-tile .gt-label .gt-role{ font-size:10px; opacity:.85; font-weight:500; margin-top:1px; }

  /* Generic list rows (world / relationships) */
  .row-list{ display:flex; flex-direction:column; gap:12px; }
  .item-row{
    background:var(--bg); border:none; border-radius:var(--radius-md); padding:14px 16px;
    box-shadow:var(--shadow-sm); display:flex; gap:12px; align-items:flex-start;
  }
  .item-row .ir-main{ flex:1; min-width:0; }
  .ir-title{ font-weight:800; font-size:14.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tag{ font-size:11px; font-weight:700; padding:2px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); }
  .tag.cat{ background:#EFEBFF; color:var(--purple); }
  .tag-overdue{ background:#FDEDEB; color:var(--red); }
  .tag-soon{ background:#FFF3DE; color:#B8790C; }
  .schedule-overdue{ padding-left:20px; box-shadow:var(--shadow-sm), inset 6px 0 0 var(--red); }
  .ir-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; white-space:pre-wrap; }
  .ir-actions{ display:flex; gap:6px; flex:none; }

  .favor-positive{ color:var(--green); }
  .favor-negative{ color:var(--red); }
  .favor-neutral{ color:var(--gray); }
  .favor-complex{ color:var(--purple); }
  .favor-chip{ font-size:11.5px; font-weight:800; padding:3px 11px; border-radius:999px; }
  .favor-chip.favor-positive{ background:#E8F8F1; }
  .favor-chip.favor-negative{ background:#FDEDEB; }
  .favor-chip.favor-neutral{ background:#F1F0F5; }
  .favor-chip.favor-complex{ background:#F1EDFF; }

  /* Diagram */
  .diagram-wrap{ background:var(--bg); border:none; border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow); margin-bottom:22px; }
  .diagram-wrap svg{ width:100%; height:auto; display:block; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:14px; height:3px; border-radius:2px; display:inline-block; }

  /* Timeline */
  .timeline{ position:relative; padding-left:26px; }
  .timeline::before{ content:''; position:absolute; left:8px; top:6px; bottom:6px; width:3px; background:linear-gradient(var(--line-strong),var(--line-strong)); border-radius:3px; }
  .tl-item{ position:relative; margin-bottom:16px; }
  .tl-item::before{ content:''; position:absolute; left:-26px; top:6px; width:14px; height:14px; border-radius:50%; background:var(--accent-deep); border:3px solid var(--bg); box-shadow:0 0 0 2px var(--line-strong); }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc as fsDoc, getDoc as fsGetDoc, collection as fsCollection,
  addDoc as fsAddDoc, updateDoc as fsUpdateDoc, deleteDoc as fsDeleteDoc,
  getDocs as fsGetDocs, onSnapshot as fsOnSnapshot
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAkoqpr_NQWHLACbjDWscyz78edipjq9lU",
  authDomain: "sousaku-labo.firebaseapp.com",
  projectId: "sousaku-labo",
  storageBucket: "sousaku-labo.firebasestorage.app",
  messagingSenderId: "319541429312",
  appId: "1:319541429312:web:461791e540a8b5c24d4ba5"
};
const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const fbDb = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();
let currentUser = null;

/* ============================= AUTH GATE ============================= */
function showAuthGate(){ document.getElementById('authGate').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
function hideAuthGate(){ document.getElementById('authGate').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); }

const authStatusEl = document.getElementById('authStatus');
const loginBtn = document.getElementById('googleLoginBtn');
const deniedBox = document.getElementById('authDenied');
const deniedEmailEl = document.getElementById('authDeniedEmail');

loginBtn.addEventListener('click', async ()=>{
  loginBtn.disabled = true; authStatusEl.textContent = 'ログイン中…';
  try{ await signInWithPopup(fbAuth, googleProvider); }
  catch(e){ console.error(e); authStatusEl.textContent = 'ログインに失敗しました。もう一度お試しください。'; }
  loginBtn.disabled = false;
});
document.getElementById('switchAccountBtn').addEventListener('click', ()=> signOut(fbAuth));

let booted = false;
onAuthStateChanged(fbAuth, async (user)=>{
  currentUser = user;
  deniedBox.classList.add('hidden'); loginBtn.classList.add('hidden');
  showAuthGate();
  if (!user){
    authStatusEl.textContent = 'このアプリを使うにはGoogleアカウントでログインしてください。';
    loginBtn.classList.remove('hidden');
    return;
  }
  authStatusEl.textContent = '確認中…';
  try{
    await fsGetDoc(fsDoc(fbDb, 'allowedEmails', user.email));
  }catch(err){
    deniedEmailEl.textContent = user.email;
    deniedBox.classList.remove('hidden');
    authStatusEl.textContent = '';
    return;
  }
  hideAuthGate();
  if (!booted){ booted = true; boot(); }
  else { updateSyncPill(); }
});

/* ============================= STORAGE LAYER (Firestore) ============================= */
const Store = {
  mode: 'firebase',
  async init(){ /* auth already resolved before boot() runs */ },
  watchProjects(cb){
    return fsOnSnapshot(fsCollection(fbDb, 'projects'), snap=>{
      const list = snap.docs.map(d=>({id:d.id, ...d.data()}));
      list.sort((a,b)=>(a.order||0)-(b.order||0));
      cb(list);
    }, err=>{ console.error('watchProjects', err); cb([]); });
  },
  watchSub(pid, sub, cb){
    return fsOnSnapshot(fsCollection(fbDb, `projects/${pid}/${sub}`),
      snap=> cb(snap.docs.map(d=>({id:d.id, ...d.data()}))),
      err=>{ console.error('watchSub', sub, err); cb([]); }
    );
  },
  async addProject(data){ const ref = await fsAddDoc(fsCollection(fbDb,'projects'), data); return ref.id; },
  async updateProject(id, patch){ return fsUpdateDoc(fsDoc(fbDb,'projects',id), patch); },
  async deleteProject(id){
    const subs = ['characters','relationships','timeline','world','plot','schedule'];
    for (const s of subs){
      const snap = await fsGetDocs(fsCollection(fbDb, `projects/${id}/${s}`));
      for (const d of snap.docs){ await fsDeleteDoc(d.ref); }
    }
    return fsDeleteDoc(fsDoc(fbDb,'projects',id));
  },
  async addDoc(pid, sub, data){ const ref = await fsAddDoc(fsCollection(fbDb, `projects/${pid}/${sub}`), data); return ref.id; },
  async updateDoc(pid, sub, id, patch){ return fsUpdateDoc(fsDoc(fbDb, `projects/${pid}/${sub}/${id}`), patch); },
  async deleteDoc(pid, sub, id){ return fsDeleteDoc(fsDoc(fbDb, `projects/${pid}/${sub}/${id}`)); },
  async softDeleteDoc(pid, sub, id){ return fsUpdateDoc(fsDoc(fbDb, `projects/${pid}/${sub}/${id}`), {deletedAt:Date.now(), deletedBy:nick()}); },
  async restoreDoc(pid, sub, id){ return fsUpdateDoc(fsDoc(fbDb, `projects/${pid}/${sub}/${id}`), {deletedAt:null, deletedBy:null}); },
  async softDeleteProject(id){ return fsUpdateDoc(fsDoc(fbDb,'projects',id), {deletedAt:Date.now(), deletedBy:nick()}); },
  async restoreProject(id){ return fsUpdateDoc(fsDoc(fbDb,'projects',id), {deletedAt:null, deletedBy:null}); },
  async estimateUsageBytes(){
    let total = 0;
    const projSnap = await fsGetDocs(fsCollection(fbDb, 'projects'));
    for (const pDoc of projSnap.docs){
      total += new Blob([JSON.stringify(pDoc.data())]).size;
      const subs = ['characters','relationships','timeline','world','plot','schedule'];
      for (const s of subs){
        const subSnap = await fsGetDocs(fsCollection(fbDb, `projects/${pDoc.id}/${s}`));
        subSnap.docs.forEach(d=>{ total += new Blob([JSON.stringify(d.data())]).size; });
      }
    }
    return total;
  }
};

/* ============================= APP STATE ============================= */
const State = {
  projects: [],
  trashedProjects: [],
  currentProjectId: null,
  activeTab: 'characters',
  data: { characters:[], relationships:[], timeline:[], world:[], plot:[], schedule:[] },
  trash: { characters:[], relationships:[], timeline:[], world:[], plot:[], schedule:[] },
  unsubs: [],
  nickname: localStorage.getItem('hakoniwa_nick') || ''
};

const PRESET_COLORS = ['#6C4CF0','#E24E6B','#E8843F','#D6A72E','#4CAE50','#0FA394','#3F7FE0','#7C5CFC','#D6588C','#726D93'];

function nick(){ return State.nickname.trim() || (currentUser && (currentUser.displayName || currentUser.email)) || 'ゲスト'; }
function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(k=>{
    if (k==='class') node.className = attrs[k];
    else if (k==='html') node.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k]==='function') node.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === true) node.setAttribute(k, '');
    else if (attrs[k] === false || attrs[k] === null || attrs[k] === undefined) { /* omit falsy boolean attrs (e.g. disabled) */ }
    else node.setAttribute(k, attrs[k]);
  });
  (children||[]).forEach(c=>{ if (c) node.appendChild(typeof c==='string' ? document.createTextNode(c) : c); });
  return node;
}
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const t = el('div', {class:'toast'}, [msg]);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(), 300); }, 2200);
}
const PARTICLE_COLORS = ['#6C4CF0','#E24E6B','#E8843F','#D6A72E','#4CAE50','#0FA394','#3F7FE0','#7C5CFC','#D6588C'];
function spawnParticles(originEl){
  const host = document.createElement('div');
  host.className = 'particle-host';
  if (originEl){
    const r = originEl.getBoundingClientRect();
    host.style.left = (r.left + r.width/2) + 'px';
    host.style.top = (r.top + r.height/2) + 'px';
  }
  document.body.appendChild(host);
  for (let i=0; i<16; i++){
    const p = document.createElement('span');
    const isTriangle = Math.random() < 0.5;
    const color = PARTICLE_COLORS[Math.floor(Math.random()*PARTICLE_COLORS.length)];
    const size = 14 + Math.random()*16;
    const angle = Math.random()*Math.PI*2;
    const dist = 70 + Math.random()*130;
    p.className = 'particle '+(isTriangle ? 'particle-triangle' : 'particle-square');
    p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    p.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
    p.style.setProperty('--rot', ((Math.random()*360)|0)+'deg');
    if (isTriangle){
      p.style.borderLeftWidth = (size/2)+'px';
      p.style.borderRightWidth = (size/2)+'px';
      p.style.borderBottomWidth = size+'px';
      p.style.borderBottomColor = color;
    } else {
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.background = color;
    }
    host.appendChild(p);
  }
  setTimeout(()=> host.remove(), 700);
}
async function persistCustomOrder(sub, arr){
  await Promise.all(arr.map((item, idx)=> Store.updateDoc(State.currentProjectId, sub, item.id, {order:(idx+1)*10, updatedBy:nick()})));
}
function makeDraggableList(container, sortedItems, sub){
  let dragId = null;
  Array.from(container.children).forEach((row, idx)=>{
    const item = sortedItems[idx];
    if (!item) return;
    row.draggable = true;
    row.addEventListener('dragstart', ()=>{ dragId = item.id; row.classList.add('dragging'); });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); });
    row.addEventListener('dragover', (e)=>{ e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', ()=>{ row.classList.remove('drag-over'); });
    row.addEventListener('drop', (e)=>{
      e.preventDefault(); row.classList.remove('drag-over');
      if (!dragId || dragId === item.id) return;
      const fromIdx = sortedItems.findIndex(x=>x.id===dragId);
      const toIdx = sortedItems.findIndex(x=>x.id===item.id);
      if (fromIdx<0 || toIdx<0) return;
      const arr = [...sortedItems];
      const [moved] = arr.splice(fromIdx,1);
      arr.splice(toIdx,0,moved);
      persistCustomOrder(sub, arr);
    });
  });
}
function contrastColor(hex){
  try{
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return ((r*299+g*587+b*114)/1000) > 150 ? '#2A2145' : '#FFFFFF';
  }catch(e){ return '#FFFFFF'; }
}
function resizeImageToDataUrl(file, maxDim, maxBytes){
  maxDim = maxDim || 420; maxBytes = maxBytes || 120000;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(reader.error || new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('image load failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let quality = 0.82, dataUrl = '';
        for (let attempt=0; attempt<6; attempt++){
          canvas.width = w; canvas.height = h;
          ctx.clearRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          if (dataUrl.length <= maxBytes*1.37) break;
          quality = Math.max(0.35, quality-0.15);
          w = Math.round(w*0.85); h = Math.round(h*0.85);
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function confirmDialog(message){

    const box = el('div', {class:'modal', style:'max-width:360px;'});
    box.appendChild(el('div', {style:'font-size:14.5px; line-height:1.6; color:var(--ink);'}, [message]));

    foot.appendChild(el('button', {class:'btn btn-danger', onclick:()=>{ back.remove(); resolve(true); }}, ['削除する']));
    box.appendChild(foot);
    back.appendChild(box);
    document.body.appendChild(back);

function openForm({title, fields, initial, submitLabel, onSubmit, onDelete, celebrate, onReady}){
  initial = initial || {};
  const root = document.getElementById('modalRoot');
  root.innerHTML = '';
  const back = el('div', {class:'modal-back', onclick:(e)=>{ if(e.target===back) closeModal(); }});
  const modal = el('div', {class:'modal'});
  modal.appendChild(el('h3', {}, [title]));

  const fieldRefs = {};
  fields.forEach(f=>{
    const wrap = el('label', {class:'field'}, [el('span', {}, [f.label])]);
    let input;
    if (f.type==='textarea'){
      input = el('textarea', {rows: f.rows||3, placeholder: f.placeholder||''});
      input.value = initial[f.key] || '';
    } else if (f.type==='select'){
      input = el('select', {});
      (f.options||[]).forEach(o=>{
        const opt = el('option', {value:o.value}, [o.label]);
        if ((initial[f.key] ?? f.default) === o.value) opt.setAttribute('selected','selected');
        input.appendChild(opt);
      });
    } else if (f.type==='combo'){
      input = el('input', {type:'text', placeholder: f.placeholder||''});
      input.value = initial[f.key] ?? (f.default ?? '');
      wrap.appendChild(input);
      const chipBox = el('div', {class:'suggest-chips'});
      (f.options||[]).forEach(o=>{
        chipBox.appendChild(el('button', {type:'button', class:'suggest-chip', onclick:()=>{ input.value = o.value; input.focus(); }}, [o.value]));
      });
      wrap.appendChild(chipBox);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      fieldRefs[f.key] = input;
      modal.appendChild(wrap);
      return;
    } else if (f.type==='image'){
      let currentVal = initial[f.key] || '';
      const preview = el('div', {class:'image-preview'});
      function renderPreview(){
        preview.innerHTML = '';
        if (currentVal) preview.appendChild(el('img', {src:currentVal}));
        else preview.appendChild(el('span', {class:'image-preview-empty'}, ['画像なし']));
      }
      renderPreview();
      const fileInput = el('input', {type:'file', accept:'image/*'});
      fileInput.addEventListener('change', async ()=>{
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        try{ currentVal = await resizeImageToDataUrl(file); renderPreview(); }
        catch(e){ toast('画像の読み込みに失敗しました'); }
      });
      const clearBtn = el('button', {type:'button', class:'btn btn-sm', onclick:()=>{ currentVal=''; fileInput.value=''; renderPreview(); }}, ['画像を削除']);
      const rowWrap = el('div', {class:'image-field-row'}, [preview, el('div', {class:'image-field-controls'}, [fileInput, clearBtn])]);
      wrap.appendChild(rowWrap);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      fieldRefs[f.key] = { get value(){ return currentVal; } };
      modal.appendChild(wrap);
      return;
    } else if (f.type==='color'){
      const rowWrap = el('div', {class:'color-row'});
      const colorInput = el('input', {type:'color'});
      colorInput.value = initial[f.key] || f.default || '#6C4CF0';
      const hexInput = el('input', {type:'text', class:'hexcode-input', placeholder:'#RRGGBB', maxlength:7});
      hexInput.value = colorInput.value.toUpperCase();
      const swatches = el('div', {class:'swatches'});
      function syncSwatches(){
        swatches.querySelectorAll('.swatch').forEach(s=> s.classList.toggle('active', s.title.toLowerCase()===colorInput.value.toLowerCase()));
      }
      function setColor(hex){
        colorInput.value = hex; hexInput.value = hex.toUpperCase(); syncSwatches();
      }
      PRESET_COLORS.forEach(c=>{
        const sw = el('div', {class:'swatch'+(c.toLowerCase()===colorInput.value.toLowerCase()?' active':''), title:c, onclick:()=> setColor(c)});
        sw.style.background = c;
        swatches.appendChild(sw);
      });
      colorInput.addEventListener('input', ()=>{ hexInput.value = colorInput.value.toUpperCase(); syncSwatches(); });
      function applyHexInput(){
        let v = hexInput.value.trim();
        if (v && !v.startsWith('#')) v = '#'+v;
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) setColor(v);
        else hexInput.value = colorInput.value.toUpperCase();
      }
      hexInput.addEventListener('change', applyHexInput);
      hexInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter'){ e.preventDefault(); applyHexInput(); } });
      rowWrap.appendChild(swatches); rowWrap.appendChild(colorInput); rowWrap.appendChild(hexInput);
      wrap.appendChild(rowWrap);
      fieldRefs[f.key] = { get value(){ return colorInput.value; } };
      modal.appendChild(wrap);
      return;
    } else if (f.type==='checkbox'){
      const rowWrap = el('div', {style:'display:flex;align-items:center;gap:8px;'});
      input = el('input', {type:'checkbox'});
      input.style.width = 'auto';
      input.checked = !!initial[f.key];
      rowWrap.appendChild(input);
      wrap.appendChild(rowWrap);
      fieldRefs[f.key] = input;
      modal.appendChild(wrap);
      return;
    } else if (f.type==='multiselect'){
      const box = el('div', {class:'multiselect-box'});
      const selected = new Set(initial[f.key] || []);
      (f.options||[]).forEach(o=>{
        const chip = el('div', {class:'ms-chip'+(selected.has(o.value)?' on':''), onclick:()=>{
          if (selected.has(o.value)){ selected.delete(o.value); chip.classList.remove('on'); }
          else { selected.add(o.value); chip.classList.add('on'); }
        }}, [o.label]);
        box.appendChild(chip);
      });
      wrap.appendChild(box);
      fieldRefs[f.key] = { get value(){ return Array.from(selected); } };
      modal.appendChild(wrap);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      return;
    } else {
      input = el('input', {type: f.type||'text', placeholder: f.placeholder||''});
      input.value = initial[f.key] ?? (f.default ?? '');
    }
    wrap.appendChild(input);
    if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
    fieldRefs[f.key] = input;
    modal.appendChild(wrap);
  });

  if (onReady) onReady(fieldRefs, modal);

  const foot = el('div', {class:'modal-foot'});
  if (onDelete){
    foot.appendChild(el('button', {class:'btn btn-danger', onclick: async ()=>{
      if (await confirmDialog('本当に削除しますか？この操作は取り消せません。')){ onDelete(); closeModal(); }
    }}, ['削除']));
    foot.appendChild(el('div', {style:'flex:1'}));
  }
  foot.appendChild(el('button', {class:'btn', onclick: closeModal}, ['キャンセル']));
  const submitBtn = el('button', {class:'btn btn-primary', onclick:()=>{
    const out = {};
    fields.forEach(f=>{
      const ref = fieldRefs[f.key];
      if (f.type==='checkbox') out[f.key] = !!ref.checked;
      else if (f.type==='number') out[f.key] = ref.value===''? null : Number(ref.value);
      else out[f.key] = ref.value;
    });
    if (celebrate) spawnParticles(submitBtn);
    Promise.resolve(onSubmit(out)).catch(err=>{
      console.error(err);
      toast('保存に失敗しました。画像が大きすぎる可能性があります');
    });
    closeModal();
  }}, [submitLabel || '保存']);
  foot.appendChild(submitBtn);
  modal.appendChild(foot);
  back.appendChild(modal);
  root.appendChild(back);
}

function charById(id){ return State.data.characters.find(c=>c.id===id); }
function charBirthYear(c){ return c.birthYear!=null ? c.birthYear : extractYear(c.birth); }
function charDeathYear(c){ return c.deathYear!=null ? c.deathYear : extractYear(c.death); }
function charAge(c){
  const by = charBirthYear(c), dy = charDeathYear(c);
  if (by!=null && dy!=null) return dy-by;
  return c.age!=null ? c.age : null;
}
let charViewMode = 'list';

function sortCharacters(list){
  const out = [...list];
  if (charSortKey === 'name') out.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'ja'));
  else if (charSortKey === 'role') out.sort((a,b)=> (a.role||'').localeCompare(b.role||'', 'ja'));
  else if (charSortKey === 'custom') out.sort((a,b)=> (a.order??0)-(b.order??0));
  return out;
}
function filterCharacters(list){
  const q = charSearchText.trim().toLowerCase();
  return list.filter(c=>{
    if (!q) return true;
    const hay = [c.name, c.reading, c.role, c.affiliation, c.personality, c.background, c.notes].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
}

const FAVOR_OPTIONS = [
  {value:'positive', label:'好意的 ・ 友好'}, {value:'negative', label:'敵対的 ・ 対立'},
  {value:'complex', label:'複雑 ・ 両面的'}, {value:'neutral', label:'中立 ・ その他'}
];
const FAVOR_COLOR = { positive:'#1FA070', negative:'#E24E6B', complex:'#7C5CFC', neutral:'#9C97AE' };
const FAVOR_LABEL = { positive:'好意的', negative:'敵対的', complex:'複雑', neutral:'中立' };
const FAVOR_ORDER = { positive:0, complex:1, neutral:2, negative:3 };
const RELATIONSHIP_SORTS = [['created','登録順（追加した順）'], ['nameA','キャラクターA名順（あいうえお順）'], ['favor','感情の方向順（好意的→複雑→中立→敵対的）'], ['custom','カスタム（ドラッグで並び替え）']];
let relSortKey = 'created';
function sortRelationships(list){
  const out = [...list];
  if (relSortKey === 'nameA'){
    out.sort((a,b)=> (charById(a.fromId)?.name||'').localeCompare(charById(b.fromId)?.name||'', 'ja'));
  } else if (relSortKey === 'favor'){
    out.sort((a,b)=> (FAVOR_ORDER[a.favor] ?? 9) - (FAVOR_ORDER[b.favor] ?? 9));
  } else if (relSortKey === 'custom'){
    out.sort((a,b)=> (a.order??0) - (b.order??0));
  }
  return out;
}
async function moveRelationship(sorted, idx, dir){
  const other = sorted[idx+dir], cur = sorted[idx];
  if (!other) return;
  const a = cur.order ?? 0, b = other.order ?? 0;
  await Store.updateDoc(State.currentProjectId, 'relationships', cur.id, {order:b, updatedBy:nick()});
  await Store.updateDoc(State.currentProjectId, 'relationships', other.id, {order:a, updatedBy:nick()});
}

function buildRelationshipDiagram(){
  const wrap = el('div', {class:'diagram-wrap fade-in'});
  const chars = State.data.characters;
  const n = Math.max(chars.length, 1);
  const R = Math.min(340, Math.max(140, 60 + n * 16));
  const W = Math.round(R*2 + 180), H = Math.round(R*2 + 140);
  const cx = W/2, cy = H/2;
  const pos = {};
  chars.forEach((c,i)=>{
    const angle = (i / chars.length) * Math.PI*2 - Math.PI/2;
    pos[c.id] = { x: cx + R*Math.cos(angle), y: cy + R*Math.sin(angle) };
  });
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans JP, sans-serif">`;
  svg += '<defs>';
  Object.keys(FAVOR_COLOR).forEach(key=>{
    svg += `<marker id="arrow-${key}" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1L6,5L0,9z" fill="${FAVOR_COLOR[key]}" /></marker>`;
  });
  svg += '</defs>';
  const pairGroups = {};
  State.data.relationships.forEach(r=>{
    if (!pos[r.fromId] || !pos[r.toId]) return;
    const key = [r.fromId, r.toId].sort().join('|');
    (pairGroups[key] = pairGroups[key]||[]).push(r);
  });
  const NODE_R = 30;
  Object.values(pairGroups).forEach(list=>{
    const n = list.length;
    list.forEach((r,idx)=>{
      const a = pos[r.fromId], b = pos[r.toId];
      const color = FAVOR_COLOR[r.favor] || FAVOR_COLOR.neutral;
      const markerId = r.favor && FAVOR_COLOR[r.favor] ? r.favor : 'neutral';
      const markers = r.mutual
        ? `marker-start="url(#arrow-${markerId})" marker-end="url(#arrow-${markerId})"`
        : `marker-end="url(#arrow-${markerId})"`;
      if (n === 1){
        const dx = b.x-a.x, dy = b.y-a.y, len = Math.sqrt(dx*dx+dy*dy) || 1;
        const ux = dx/len, uy = dy/len;
        const sx = a.x+ux*NODE_R, sy = a.y+uy*NODE_R;
        const ex = b.x-ux*NODE_R, ey = b.y-uy*NODE_R;
        svg += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="2.5" stroke-linecap="round" ${markers} />`;
      } else {
        const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
        const dx = b.x-a.x, dy = b.y-a.y;
        const len = Math.sqrt(dx*dx+dy*dy) || 1;
        const nx = -dy/len, ny = dx/len;
        const side = (idx % 2 === 0) ? 1 : -1;
        const magnitude = 20 * (Math.floor(idx/2) + 1);
        const cxp = mx + nx*magnitude*side, cyp = my + ny*magnitude*side;
        const dxs = cxp-a.x, dys = cyp-a.y, lens = Math.sqrt(dxs*dxs+dys*dys) || 1;
        const sx = a.x + (dxs/lens)*NODE_R, sy = a.y + (dys/lens)*NODE_R;
        const dxe = b.x-cxp, dye = b.y-cyp, lene = Math.sqrt(dxe*dxe+dye*dye) || 1;
        const ex = b.x - (dxe/lene)*NODE_R, ey = b.y - (dye/lene)*NODE_R;
        svg += `<path d="M${sx},${sy} Q${cxp},${cyp} ${ex},${ey}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" ${markers} />`;
      }
    });
  });
  chars.forEach(c=>{
    const p = pos[c.id];
    const color = c.color || '#6C4CF0';
    const tColor = contrastColor(color);
    if (c.image){
      const clipId = 'clip-'+c.id;
      svg += `<defs><clipPath id="${clipId}"><circle cx="${p.x}" cy="${p.y}" r="23" /></clipPath></defs>`;
      svg += `<image href="${c.image}" x="${p.x-26}" y="${p.y-26}" width="52" height="52" clip-path="url(#${clipId})" preserveAspectRatio="xMidYMid slice" />`;
      svg += `<circle cx="${p.x}" cy="${p.y}" r="23" fill="none" stroke="${color}" stroke-width="3.5" />`;
    } else {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="26" fill="${color}" stroke="#FFFFFF" stroke-width="3" />`;
      svg += `<text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="16" font-weight="800" fill="${tColor}">${esc((c.name||'?').charAt(0))}</text>`;
    }
    const labelY = p.y + (p.y > cy ? 44 : -36);
    svg += `<text x="${p.x}" y="${labelY}" text-anchor="middle" font-size="13" font-weight="800" fill="#211B3D" style="paint-order:stroke; stroke:#F1F2F7; stroke-width:5px; stroke-linejoin:round;">${esc(c.name||'')}</text>`;
  });
  svg += `</svg>`;
  wrap.innerHTML = svg;
  const legend = el('div', {class:'legend'}, [
    el('span',{},[el('i',{style:'background:#1FA070'}),'好意的']),
    el('span',{},[el('i',{style:'background:#E24E6B'}),'敵対的']),
    el('span',{},[el('i',{style:'background:#7C5CFC'}),'複雑']),
    el('span',{},[el('i',{style:'background:#9C97AE'}),'中立']),
    el('span',{},['矢印は関係の向き（両端に矢印＝相互）'])
  ]);
  wrap.appendChild(legend);
  return wrap;
}

const SCHEDULE_STATUS_CLASS = {todo:'st-draft', doing:'st-writing', done:'st-done'};
function todayStr(){ return new Date().toISOString().slice(0,10); }
function scheduleUrgency(s){
  if (s.status === 'done' || !s.dueDate) return 'none';
  const today = todayStr();
  if (s.dueDate < today) return 'overdue';
  const soon = new Date(); soon.setDate(soon.getDate()+3);
  if (s.dueDate <= soon.toISOString().slice(0,10)) return 'soon';
  return 'none';
}

/* ============================= CONTRADICTION CHECKS ============================= */
let lastIssues = [];
function extractYear(str){
  if (!str) return null;
  const m = String(str).match(/-?\d{1,6}/);
  return m ? parseInt(m[0],10) : null;
}
function runChecks(){
  const issues = [];
  const { characters, relationships, timeline, world, plot } = State.data;
  const charIds = new Set(characters.map(c=>c.id));

  // 1. duplicate names
  const nameMap = {};
  characters.forEach(c=>{
    const key = (c.name||'').trim().toLowerCase();
    if (!key) return;
    (nameMap[key] = nameMap[key]||[]).push(c);
  });
  Object.values(nameMap).forEach(list=>{
    if (list.length > 1) issues.push({ severity:'warning', message:`キャラクター名「${list[0].name}」が${list.length}件重複しています`, detail:'同一人物か、名前を変えるべきか確認してください。', tab:'characters', targetType:'characters', targetId:list[0].id });
  });

  // 2. orphan relationship references
  relationships.forEach(r=>{
    if (!charIds.has(r.fromId) || !charIds.has(r.toId)){
      issues.push({ severity:'error', message:'削除済みのキャラクターを参照している関係性があります', detail:`関係「${r.type||''}」が存在しないキャラクターを指しています。編集または削除してください。`, tab:'relationships', targetType:'relationships', targetId:r.id });
    } else if (r.fromId === r.toId){
      const c = charById(r.fromId);
      issues.push({ severity:'warning', message:`「${c?c.name:'?'}」の関係性が自分自身に向いています`, detail:'キャラクターの差し替えが途中になっていないか確認してください。', tab:'relationships', targetType:'relationships', targetId:r.id });
    }
  });

  // 3. birth/death vs timeline
  characters.forEach(c=>{
    const birthY = charBirthYear(c), deathY = charDeathYear(c);
    if (birthY==null && deathY==null) return;
    if (birthY!=null && deathY!=null && deathY < birthY){
      issues.push({ severity:'error', message:`「${c.name}」の没年（${deathY}）が生年（${birthY}）より前になっています`, detail:'生年と没年の表記を見直してください。', tab:'characters', targetType:'characters', targetId:c.id });
    }
    timeline.forEach(t=>{
      if (t.isFlashback) return;
      if (!t.charIds || !t.charIds.includes(c.id)) return;
      const evY = extractYear(t.dateLabel);
      if (evY==null) return;
      if (deathY!=null && evY > deathY){
        issues.push({ severity:'warning', message:`「${c.name}」の没年（${deathY}）より後の年表に登場しています`, detail:`出来事「${t.title||''}」（${t.dateLabel}）`, tab:'timeline', targetType:'timeline', targetId:t.id });
      }
      if (birthY!=null && evY < birthY){
        issues.push({ severity:'warning', message:`「${c.name}」の生年（${birthY}）より前の年表に登場しています`, detail:`出来事「${t.title||''}」（${t.dateLabel}）`, tab:'timeline', targetType:'timeline', targetId:t.id });
      }
    });
  });

  // 4. conflicting relationships between same pair
  const pairMap = {};
  relationships.forEach(r=>{
    const key = [r.fromId, r.toId].sort().join('|');
    (pairMap[key] = pairMap[key]||[]).push(r);
  });
  Object.values(pairMap).forEach(list=>{
    if (list.length < 2) return;
    const favors = new Set(list.map(r=>r.favor));
    if (favors.has('positive') && favors.has('negative')){
      const a = charById(list[0].fromId), b = charById(list[0].toId);
      issues.push({ severity:'warning', message:`「${a?a.name:'?'}」と「${b?b.name:'?'}」の関係が好意的・敵対的の両方で登録されています`, detail:'時期による変化なら関係の説明欄に補足すると分かりやすくなります。', tab:'relationships', targetType:'relationships', targetId:list[0].id });
    }
  });

  // 5. duplicate plot order
  const orderMap = {};
  plot.forEach(p=>{ const k = String(p.order); (orderMap[k]=orderMap[k]||[]).push(p); });
  Object.values(orderMap).forEach(list=>{
    if (list.length > 1) issues.push({ severity:'warning', message:`プロットの並び順が重複しています（${list.map(p=>p.title||'無題').join(' / ')}）`, detail:'順序を調整すると章の流れが分かりやすくなります。', tab:'plot', targetType:'plot', targetId:list[0].id });
  });

  // 6. duplicate world entry names within category
  const worldMap = {};
  world.forEach(w=>{ const k = (w.category||'')+'|'+(w.name||'').trim().toLowerCase(); if(!w.name) return; (worldMap[k]=worldMap[k]||[]).push(w); });
  Object.values(worldMap).forEach(list=>{
    if (list.length > 1) issues.push({ severity:'warning', message:`世界観設定「${list[0].name}」（${list[0].category}）が重複しています`, detail:'同じ対象を別々に登録していないか確認してください。', tab:'world', targetType:'world', targetId:list[0].id });
  });

  lastIssues = issues;
  const badge1 = document.getElementById('issueBadge'), badge2 = document.getElementById('issueBadgeMobile');
  [badge1, badge2].forEach(b=>{
    if (!b) return;
    if (issues.length){ b.textContent = issues.length; b.classList.remove('hidden'); }
    else { b.classList.add('hidden'); }
  });
  if (State.activeTab === 'checks') renderChecks();
}
function totalTrashCount(){
  return Object.values(State.trash).reduce((sum, arr)=> sum + arr.length, 0);
}
function updateTrashBadge(){
  const count = totalTrashCount();
  const badge1 = document.getElementById('trashBadge'), badge2 = document.getElementById('trashBadgeMobile');
  [badge1, badge2].forEach(b=>{
    if (!b) return;
    if (count){ b.textContent = count; b.classList.remove('hidden'); }
    else { b.classList.add('hidden'); }
  });
  if (State.activeTab === 'trash') renderTrash();
}
function renderChecks(){
  const view = document.getElementById('view-checks');
  view.innerHTML = '';
  view.appendChild(el('div', {class:'content-head'}, [
    el('div', {}, [ el('h2', {}, ['矛盾チェック']), el('div', {class:'sub'}, ['名前の重複、参照切れ、年表と生没年のズレなどを自動で確認します（簡易チェックです）']) ]),
    el('button', {class:'btn', onclick:()=>{ runChecks(); }}, ['再チェック'])
  ]));
  const errCount = lastIssues.filter(i=>i.severity==='error').length;
  const warnCount = lastIssues.filter(i=>i.severity==='warning').length;
  view.appendChild(el('div', {class:'check-summary'}, [
    el('div', {class:'check-pill'}, [el('div', {class:'num', style:'color:var(--red)'}, [String(errCount)]), el('div',{class:'lbl'},['エラー']), el('div',{class:'lbl-detail'},['データとして明らかに壊れている（例: 存在しない相手を参照、没年が生年より前）'])]),
    el('div', {class:'check-pill'}, [el('div', {class:'num', style:'color:#B8790C'}, [String(warnCount)]), el('div',{class:'lbl'},['注意']), el('div',{class:'lbl-detail'},['意図的な場合もある、念のための指摘（例: 名前の重複、感情が入り混じった関係）'])]),
  ]));
  if (!lastIssues.length){
    view.appendChild(el('div', {class:'all-clear'}, ['矛盾は見つかりませんでした']));
    return;
  }
  lastIssues.forEach((iss,i)=>{
    const box = el('div', {class:'issue '+iss.severity+' fade-in', style:`animation-delay:${i*30}ms`});
    box.appendChild(el('div', {class:'isv'}, [iss.severity==='error'?'ERROR':'WARNING']));
    box.appendChild(el('div', {class:'ismsg'}, [iss.message]));
    if (iss.detail) box.appendChild(el('div', {class:'isdetail'}, [iss.detail]));
    if (iss.tab) box.appendChild(el('button', {class:'btn btn-sm', style:'margin-top:8px;', onclick:()=>goToIssue(iss)}, ['該当ページを開く →']));
    view.appendChild(box);
  });
}
const ISSUE_TARGET_OPENERS = { characters:openCharacterForm, relationships:openRelationshipForm, timeline:openTimelineForm, world:openWorldForm, plot:openPlotForm };
function goToIssue(iss){
  if (!iss.tab) return;

    const item = (State.data[iss.targetType]||[]).find(x=>x.id===iss.targetId);
    const opener = ISSUE_TARGET_OPENERS[iss.targetType];
    if (item && opener) setTimeout(()=>opener(item), 30);

}

/* ============================= TRASH ============================= */
const TRASH_TYPES = [
  {sub:'characters', label:'キャラクター', name:(x)=>x.name||'(無名)'},
  {sub:'relationships', label:'関係性', name:(x)=>{ const a=charById(x.fromId), b=charById(x.toId); return `${a?a.name:'(削除済み)'} → ${b?b.name:'(削除済み)'}`; }},
  {sub:'timeline', label:'年表', name:(x)=>x.title||'(無題の出来事)'},
  {sub:'world', label:'世界観', name:(x)=>x.name||'(無題)'},
  {sub:'plot', label:'プロット', name:(x)=>x.title||'(無題の章)'},
  {sub:'schedule', label:'スケジュール', name:(x)=>x.title||'(無題の予定)'}
];
function renderTrash(){
  const view = document.getElementById('view-trash');
  view.innerHTML = '';
  view.appendChild(el('div', {class:'content-head'}, [
    el('div', {}, [ el('h2', {}, ['ゴミ箱']), el('div', {class:'sub'}, ['削除した項目を復元、または完全に削除できます']) ])
  ]));
  let any = false;
  TRASH_TYPES.forEach(t=>{
    const items = State.trash[t.sub] || [];
    if (!items.length) return;
    any = true;
    view.appendChild(el('h3', {style:'font-size:13px;color:var(--ink-soft);margin:18px 0 8px;'}, [t.label]));
    const list = el('div', {class:'row-list'});
    items.forEach((x,i)=>{
      const row = el('div', {class:'item-row fade-in', style:`animation-delay:${i*30}ms`});
      row.appendChild(el('div', {class:'ir-main'}, [
        el('div', {class:'ir-title'}, [t.name(x)]),
        el('div', {class:'ir-desc'}, [`削除者: ${x.deletedBy||'不明'}`])
      ]));
      row.appendChild(el('div', {class:'ir-actions'}, [
        el('button', {class:'btn btn-sm', onclick: async ()=>{ await Store.restoreDoc(State.currentProjectId, t.sub, x.id); toast('復元しました'); }}, ['復元']),
        el('button', {class:'btn btn-sm btn-danger', onclick: async ()=>{
          if (await confirmDialog('完全に削除します。この操作は取り消せません。よろしいですか？')){
            await Store.deleteDoc(State.currentProjectId, t.sub, x.id);
            toast('完全に削除しました');
          }
        }}, ['完全に削除'])
      ]));
      list.appendChild(row);
    });
    view.appendChild(list);
  });
  if (!any) view.appendChild(el('div', {class:'empty-state'}, ['ゴミ箱は空です。']));
}

/* ============================= WIRE UP ============================= */
function wireNav(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=> setTab(b.dataset.tab));
  });
  document.getElementById('switchProjectBtn').addEventListener('click', showGate);
  document.getElementById('mobileBackBtn').addEventListener('click', showGate);
  const nickInput = document.getElementById('nicknameInput');
  nickInput.value = State.nickname;
  nickInput.addEventListener('input', ()=>{
    State.nickname = nickInput.value;
    localStorage.setItem('hakoniwa_nick', nickInput.value);
  });
  document.getElementById('sidebarLogoutBtn').addEventListener('click', ()=> signOut(fbAuth));
}
function updateSyncPill(){
  const label = currentUser ? `${esc(currentUser.displayName || currentUser.email)} でログイン中・共同編集できます` : '接続確認中…';
  ['syncPill','syncPillGate'].forEach(id=>{
    const p = document.getElementById(id);
    if (!p) return;
    p.innerHTML = `<span class="sync-dot"></span>${label}`;
  });
}

async function checkStorageUsage(){
  const btn = document.getElementById('checkUsageBtn');
  const resultEl = document.getElementById('usageResult');
  btn.disabled = true;
  resultEl.textContent = '集計中…';
  try{
    const bytes = await Store.estimateUsageBytes();
    const mb = bytes / (1024*1024);
    const pct = (bytes / (1024*1024*1024)) * 100;
    resultEl.textContent = `推定使用量: 約 ${mb.toFixed(2)} MB / 1024 MB（${pct.toFixed(2)}%）`;
  }catch(e){
    console.error(e);
    resultEl.textContent = '集計に失敗しました';
  }
  btn.disabled = false;
}

async function boot(){
  wireNav();
  await Store.init();
  updateSyncPill();
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('checkUsageBtn').addEventListener('click', checkStorageUsage);
  Store.watchProjects((list)=>{
    State.projects = list.filter(p=>!p.deletedAt);
    State.trashedProjects = list.filter(p=>p.deletedAt);
    if (!State.currentProjectId){
      renderGate();
      const last = localStorage.getItem('hakoniwa_last_project');
      if (last && State.projects.some(p=>p.id===last)) enterProject(last);
    } else {
      const p = State.projects.find(x=>x.id===State.currentProjectId);
      if (p){
        document.getElementById('cpName').textContent = p.name;
        document.getElementById('cpDot').style.background = p.color || '#6C4CF0';
        document.getElementById('mobileProjectName').textContent = p.name;
        if (State.activeTab === 'characters' && (charViewMode === 'nicknames' || charViewMode === 'nicknameList')) renderCharacters();
      } else {
        showGate();
      }
    }
  });
}
</script>
